name: Permission matrix

# Proves the agent rows of the allowed/denied matrix of docs/ENVIRONMENT_PERMISSIONS.md with real
# calls: for every environment, the agent role is assumed and each row of
# scripts/permission-matrix.tsv is called (scripts/run-permission-matrix.sh).
#
# The deploy role is not assumed from this repository: it belongs to the application's own
# deployment flow. Its rows are proven offline by `make matrix`, and live by the application's
# workflow in its GitHub Environment, which calls the same script.
#
# Runs on every pull request, and on demand. The job is gated on the repository variable
# MATRIX_ENABLED: it stays skipped (so main stays green) until the <environment>-matrix GitHub
# Environments, their secrets and the required-check ruleset exist (the workforce-github slice),
# at which point the maintainer sets MATRIX_ENABLED to "true" and the job runs for real on every
# pull request. The demo reviewer gate is the demo-matrix environment, not this file. Output names
# roles, environments and actions only: the role ARNs are environment SECRETS (masked everywhere)
# and the runner pipes everything through scripts/redact.sh.
on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  matrix:
    name: permission-matrix ${{ matrix.role }} ${{ matrix.environment }}
    # Skipped (never failing) until the matrix infrastructure exists; forked pull requests get no
    # OIDC token, so they are skipped too.
    if: >
      vars.MATRIX_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}-matrix
    concurrency:
      group: permission-matrix-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.role }}-${{ matrix.environment }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        role: [agent]
        environment: [test, quality, demo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.MATRIX_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Run the matrix
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROLE_ARN: ${{ secrets.MATRIX_AGENT_ROLE_ARN }}
          VIA_ROLE_ARN: ${{ secrets.MATRIX_VIA_ROLE_ARN }}
          EXTERNAL_ID: ${{ secrets.MATRIX_EXTERNAL_ID }}
          MATRIX_ROLE: ${{ matrix.role }}
          MATRIX_ENVIRONMENT: ${{ matrix.environment }}
        run: scripts/run-permission-matrix.sh "$MATRIX_ROLE" "$MATRIX_ENVIRONMENT"
      - name: Summary
        if: always()
        env:
          MATRIX_ROLE: ${{ matrix.role }}
          MATRIX_ENVIRONMENT: ${{ matrix.environment }}
        run: echo "$MATRIX_ROLE $MATRIX_ENVIRONMENT - see the step above" >> "$GITHUB_STEP_SUMMARY"
