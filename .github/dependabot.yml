version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  # Each Terraform stack or module adds its directory in the PR that creates it:
  # Dependabot fails on directories that do not exist yet (make dependabot checks it).
  - package-ecosystem: terraform
    directories:
      - /bootstrap
      - /live/management
      - /live/accounts/security
      - /live/accounts/workforce
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: terraform
    directories:
      - /modules/scp-baseline
      - /modules/account-ci-baseline
      - /modules/audit-log-bucket
      - /modules/budget
      - /modules/organization-trail
      - /modules/identity-center-access
    schedule:
      interval: weekly
    commit-message:
      prefix: build
