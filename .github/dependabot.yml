version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # Each Terraform stack or module adds its directory in the PR that creates it:
  # Dependabot fails on directories that do not exist yet (make dependabot checks it).
  - package-ecosystem: terraform
    directory: /bootstrap
    schedule:
      interval: weekly
    commit-message:
      prefix: build
