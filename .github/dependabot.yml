version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  # Each Terraform stack or module adds its directory in the PR that creates it:
  # Dependabot fails on directories that do not exist yet (make dependabot checks it).
  - package-ecosystem: terraform
    directories:
      - /bootstrap
      - /bootstrap/accounts/security
      - /bootstrap/accounts/workforce
      - /bootstrap/accounts/test
      - /bootstrap/accounts/quality
      - /bootstrap/accounts/demo
      - /live/management
      - /live/accounts/security
      - /live/environments/test
      - /live/environments/quality
      - /live/environments/demo
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: terraform
    directories:
      - /modules/scp-baseline
      - /modules/account-ci-baseline
      - /modules/audit-log-bucket
      - /modules/budget
      - /modules/organization-trail
      - /modules/identity-center-access
      - /modules/cross-account-role
    schedule:
      interval: weekly
    commit-message:
      prefix: build
