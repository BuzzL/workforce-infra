version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  # Each Terraform stack or module adds its directory in the PR that creates it:
  # Dependabot fails on directories that do not exist yet (make dependabot checks it).
  - package-ecosystem: terraform
    directories:
      - /bootstrap
      - /live/management
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: terraform
    directory: /modules/scp-baseline
    schedule:
      interval: weekly
    commit-message:
      prefix: build
